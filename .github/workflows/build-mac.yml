name: Build macOS & Windows Agent Installers

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Desktop Agent Dependencies
        run: |
          cd desktop-agent
          npm install

      - name: Build macOS Agent Packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          cd desktop-agent
          npm run build
          npx electron-builder --mac zip dmg -c.mac.identity=null

      - name: Upload Mac Installers
        uses: actions/upload-artifact@v4
        with:
          name: Improx-Monitoring-Agent-Mac
          path: |
            desktop-agent/release/*.dmg
            desktop-agent/release/*.zip
          if-no-files-found: warn