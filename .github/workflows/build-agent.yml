name: Build macOS Desktop Agent (DMG Only)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-mac-dmg:
    name: Build macOS DMG Installer
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Desktop Agent Dependencies
        run: |
          cd desktop-agent
          npm install

      - name: Build macOS DMG Binary
        run: |
          cd desktop-agent
          npm run dist:mac

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Improx-Agent-macOS-DMG
          path: desktop-agent/release/*.dmg
