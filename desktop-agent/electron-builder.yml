appId: com.improx.monitor.agent
productName: Improx Monitoring Agent
directories:
  output: release
files:
  - dist/**/*
  - bin/**/*
  - src/ui/**/*
  - assets/**/*
win:
  target: nsis
  icon: assets/icon.ico
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  installerHeaderIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  runAfterFinish: true