<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Improx Monitoring Agent</title>
  <link rel="stylesheet" href="login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="window-container">
    <div class="titlebar">
      <div class="brand-title">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
        <span>Improx Agent</span>
      </div>
      <div class="window-controls">
        <button id="btnMinimize" class="control-btn">—</button>
        <button id="btnClose" class="control-btn close">✕</button>
      </div>
    </div>

    <!-- 1. LOGIN VIEW -->
    <div id="loginView" class="content">
      <div class="header">
        <h2>Employee Sign In</h2>
        <p>Log in with your company credentials to begin tracking</p>
      </div>

      <div id="errorBox" class="alert-box error hidden"></div>
      <div id="successBox" class="alert-box success hidden"></div>

      <form id="loginForm">
        <div class="input-group">
          <label>Server Endpoint</label>
          <input type="text" id="serverUrl" value="http://200.141.2.53" placeholder="http://200.141.2.53" required>
        </div>

        <div class="input-group">
          <label>Work Email</label>
          <input type="email" id="email" placeholder="employee@improx.com" required>
        </div>

        <div class="input-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" id="btnSubmit" class="btn-primary">
          <span id="btnText">Connect & Start Tracking</span>
          <div id="btnSpinner" class="spinner hidden"></div>
        </button>
      </form>
    </div>

    <!-- 2. LOGGED IN AGENT DASHBOARD VIEW -->
    <div id="agentDashboardView" class="content hidden">
      <div class="user-card">
        <div class="avatar" id="userAvatar">E</div>
        <div>
          <h3 id="userName">Employee Name</h3>
          <p id="userEmail">employee@improx.com</p>
          <p id="userShift" class="user-shift">Shift: 10:00 AM to 7:00 PM</p>
        </div>
      </div>

      <!-- TODAY STATS SUMMARY INSIDE POPUP -->
      <div class="today-stats-grid">
        <div class="stat-card">
          <span class="stat-label">Active Work Today</span>
          <span id="statActive" class="stat-value text-sky-400">0h 0m</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Idle & Breaks</span>
          <span id="statBreaks" class="stat-value text-amber-400">0h 0m</span>
        </div>
      </div>

      <!-- STATUS BANNER -->
      <div id="statusBanner" class="status-banner active">
        <span class="status-dot"></span>
        <span id="statusText">🟢 Tracking Active</span>
      </div>

      <!-- PAUSE / RESUME CONTROLS -->
      <div class="control-section">
        <button id="btnPauseToggle" class="btn-warning">
          <span>⏸️ Pause Tracking</span>
        </button>

        <button id="btnResume" class="btn-success hidden">
          <span>▶️ RESUME WORK</span>
        </button>
      </div>

      <!-- REASON SELECTOR MODAL -->
      <div id="reasonModal" class="modal-overlay hidden">
        <div class="modal-content">
          <h4>Select Pause Reason</h4>
          <p>Select your activity status while away from work:</p>

          <div class="reason-options">
            <label class="option-card">
              <input type="radio" name="pauseReason" value="In a Meeting" checked>
              <span>👥 In a Meeting (Call)</span>
            </label>
            <label class="option-card">
              <input type="radio" name="pauseReason" value="Lunch Break">
              <span>🍽️ Lunch / Meal Break</span>
            </label>
            <label class="option-card">
              <input type="radio" name="pauseReason" value="Short Break">
              <span>☕ Personal Break / Tea</span>
            </label>
            <label class="option-card">
              <input type="radio" name="pauseReason" value="Offline Work">
              <span>📚 Offline Work / Paperwork</span>
            </label>
          </div>

          <div class="input-group mt-2">
            <label>Notes / Comment (Optional)</label>
            <input type="text" id="pauseComment" placeholder="e.g. Client call with Team A">
          </div>

          <div class="modal-actions">
            <button id="btnCancelModal" class="btn-secondary">Cancel</button>
            <button id="btnConfirmPause" class="btn-primary">Confirm Pause</button>
          </div>
        </div>
      </div>

      <div class="footer-actions">
        <button id="btnClockOut" class="btn-danger-outline">⏹️ End Today's Work (Clock Out)</button>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
