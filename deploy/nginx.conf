server {
    listen 80;
    server_name 200.141.2.53;

    # Client body size for 10MB multi-monitor screenshots
    client_max_body_size 50M;

    # Frontend Static Distribution
    location / {
        root /root/improx-monitor/frontend/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Backend API & Uploads
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Uploads Static Serving
    location /uploads/ {
        alias /root/improx-monitor/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # WebSockets Engine
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}